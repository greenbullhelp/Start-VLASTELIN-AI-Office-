# Cloudflare Worker (static assets only) that serves the office site.
# Access is restricted with Cloudflare Access (one-time code to the owner's email).
# Deploy: npx.cmd wrangler deploy -c wrangler.site.toml
name = "vlastelin-office"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "."
not_found_handling = "404-page"
