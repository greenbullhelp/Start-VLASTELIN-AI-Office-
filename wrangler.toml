# Cloudflare Worker for the VLASTELIN AI agent.
# Deploy:  npx wrangler deploy
# Secrets: npx wrangler secret put ANTHROPIC_API_KEY
#          npx wrangler secret put ACCESS_CODE
name = "vlastelin-agent"
main = "worker/agent-worker.js"
compatibility_date = "2026-11-01"

[vars]
# Daily spending cap in USD; the worker answers 429 once today's spend reaches it.
DAILY_BUDGET_USD = "0.50"

# Per-day spend counter for the budget above.
[[kv_namespaces]]
binding = "BUDGET"
id = "3c65bce512414120bf7bde39b2f2bdc4"

# Shared office data (projects, events, tasks/windows, chat history) for all devices.
[[d1_databases]]
binding = "DB"
database_name = "vlastelin"
database_id = "545dc607-26a5-43c7-bdbd-3568830ce815"
