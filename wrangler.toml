# Cloudflare Worker for the VLASTELIN AI agent.
# Deploy:  npx wrangler deploy
# Secrets: npx wrangler secret put ANTHROPIC_API_KEY
#          npx wrangler secret put ACCESS_CODE
name = "vlastelin-agent"
main = "worker/agent-worker.js"
compatibility_date = "2026-11-01"

[vars]
# Sites allowed to call the agent (comma-separated). github.io stays until the old site is switched off.
ALLOWED_ORIGINS = "https://vlastelin-office.greenbull-help.workers.dev,https://greenbullhelp.github.io"
